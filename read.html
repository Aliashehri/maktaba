<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>قراءة كتاب</title>
<meta name="theme-color" content="#221d16">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a8843f'/%3E%3Cpath d='M14 18c7-3 13-2 18 2v28c-5-4-11-5-18-2zM50 18c-7-3-13-2-18 2v28c5-4 11-5 18-2z' fill='%23fffdf8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="reader">
<header class="r-top">
  <a class="ibtn" href="./" title="العودة إلى المكتبة" aria-label="العودة إلى المكتبة">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
  </a>
  <div class="r-title" id="title">…</div>
  <a class="ibtn" id="download" hidden title="تحميل الكتاب" aria-label="تحميل الكتاب" download>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 19h16"/></svg>
  </a>
  <button class="ibtn" id="zoomBtn" title="تكبير" aria-label="تكبير">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg>
  </button>
  <button class="ibtn" id="fsBtn" title="ملء الشاشة" aria-label="ملء الشاشة">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</header>

<main class="stage" id="stage">
  <button class="nav-side nav-prev" id="prevSide" aria-label="الصفحة السابقة">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
  </button>
  <div id="sizer"><div class="book-holder" id="book"></div></div>
  <button class="nav-side nav-next" id="nextSide" aria-label="الصفحة التالية">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
  </button>
  <div class="loader" id="loader"><div class="box"><div class="msg" id="loadMsg">جارٍ فتح الكتاب…</div><div class="bar"><i id="loadBar"></i></div></div></div>
</main>

<footer class="r-bottom">
  <button class="ibtn" id="prevBtn" aria-label="الصفحة السابقة" title="السابقة">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
  </button>
  <div class="pager">
    <label class="sr" for="slider">الانتقال إلى صفحة</label>
    <input type="range" id="slider" min="1" max="1" value="1">
    <div class="pnum">
      <label class="sr" for="pageInput">رقم الصفحة</label>
      <input id="pageInput" inputmode="numeric" value="1" aria-label="رقم الصفحة">
      <span>/ <span id="total">–</span></span>
    </div>
  </div>
  <button class="ibtn" id="nextBtn" aria-label="الصفحة التالية" title="التالية">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
  </button>
</footer>

<div class="zoom" id="zoom" role="dialog" aria-label="عرض مكبّر">
  <div class="z-bar">
    <button class="ibtn" id="zClose" aria-label="إغلاق" title="إغلاق">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="r-title" id="zTitle">عرض مكبّر</div>
    <button class="ibtn" id="zOut" aria-label="تصغير"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <span class="zlevel" id="zLevel">100%</span>
    <button class="ibtn" id="zIn" aria-label="تكبير"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="z-scroll" id="zScroll"><div class="z-pages" id="zPages"></div></div>
</div>
<div class="toast" id="toast"></div>

<script src="assets/common.js"></script>
<script src="lib/page-flip.browser.js"></script>
<script type="module">
import * as pdfjs from "./lib/pdf.min.mjs";
pdfjs.GlobalWorkerOptions.workerSrc = "lib/pdf.worker.min.mjs";

const { loadLibrary, store, ar } = window.Lib;
const $ = (id) => document.getElementById(id);
const DPR = Math.min(window.devicePixelRatio || 1, 2.5);

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}
function fail(msg) { $("loadMsg").textContent = msg; $("loadBar").parentElement.hidden = true; }

// ===== تحديد الكتاب =====
const params = new URLSearchParams(location.search);
const data = await loadLibrary();
let book = null;
if (params.get("id")) book = data.books.find((b) => b.id === params.get("id"));
else if (params.get("file")) book = data.books.find((b) => b.file === params.get("file"));
if (!book) { fail("لم يتم العثور على الكتاب"); throw new Error("book not found"); }

document.title = book.title + " — " + (data.site.title || "المكتبة");
$("title").textContent = book.title; $("zTitle").textContent = book.title;
if (data.site.allowDownload) { const d = $("download"); d.href = book.file; d.hidden = false; }

// ===== فتح ملف PDF =====
let pdf;
try {
  const task = pdfjs.getDocument({ url: book.file, rangeChunkSize: 262144, disableAutoFetch: false });
  task.onProgress = ({ loaded, total }) => { if (total) $("loadBar").style.width = Math.min(100, (loaded / total) * 100) + "%"; };
  pdf = await task.promise;
} catch (e) { console.error(e); fail("تعذّر فتح الكتاب، حاول تحديث الصفحة"); throw e; }

const N = pdf.numPages;
const T = N + (N % 2);              // عدد عناصر الكتاب (زوجي دائماً)
const idxOf = (p) => T - p;         // ترتيب معكوس ليكون التقليب من اليمين لليسار
const pageOf = (i) => T - i;
const first = await pdf.getPage(1);
const vp1 = first.getViewport({ scale: 1 });
const RATIO = vp1.width / vp1.height;

$("total").textContent = ar(N);
$("slider").max = N;

// ===== عناصر الصفحات =====
const els = [];       // حسب الفهرس
for (let i = 0; i < T; i++) {
  const p = pageOf(i);
  const d = document.createElement("div");
  d.className = "pg";
  if (i === 0 || i === T - 1) d.dataset.density = "hard";
  if (p > N) d.classList.add("blank");
  else { const ph = document.createElement("div"); ph.className = "pg-ph"; ph.textContent = ar(p); d.appendChild(ph); }
  els.push(d);
}

// ===== حساب المقاس =====
let landscape = true, pageW = 300;
function measure() {
  const st = $("stage");
  const wide = st.clientWidth > 640;
  const availW = st.clientWidth - (wide ? 130 : 16);
  const availH = st.clientHeight - (wide ? 32 : 16);
  const one = Math.min(availW, availH * RATIO);
  const two = Math.min(availW / 2, availH * RATIO);
  landscape = availW >= 600 && two >= one * 0.62;
  pageW = Math.floor(landscape ? two : one);
  $("sizer").style.width = (landscape ? pageW * 2 : pageW) + "px";
}
measure();

// ===== رسم الصفحات =====
const rendered = new Map(); // p -> width
const queue = []; let busy = false;
function want(p) {
  if (p < 1 || p > N) return;
  const target = Math.round(pageW * DPR);
  const have = rendered.get(p);
  if (have && have >= target * 0.87) return;
  if (!queue.includes(p)) queue.push(p);
  pump();
}
async function pump() {
  if (busy) return; busy = true;
  while (queue.length) {
    const p = queue.shift();
    const target = Math.round(pageW * DPR);
    try {
      const page = await pdf.getPage(p);
      const vp0 = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: target / vp0.width });
      const c = document.createElement("canvas");
      c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      const ctx = c.getContext("2d", { alpha: false });
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      const el = els[idxOf(p)];
      el.querySelectorAll("canvas,.pg-ph").forEach((n) => n.remove());
      el.appendChild(c);
      rendered.set(p, target);
    } catch (e) { console.warn("render", p, e); }
  }
  busy = false;
}

// ===== الكتاب المتقلب =====
const saved = parseInt(store.get("pos:" + book.file) || "1", 10);
const startP = saved >= 1 && saved <= N ? saved : 1;

const flip = new St.PageFlip($("book"), {
  width: Math.round(vp1.width), height: Math.round(vp1.height),
  size: "stretch", autoSize: true,
  minWidth: 50, maxWidth: 4000, minHeight: 50, maxHeight: 6000,
  showCover: true, usePortrait: true, mobileScrollSupport: false,
  drawShadow: true, maxShadowOpacity: 0.45, flippingTime: 750,
  showPageCorners: true, disableFlipByClick: false,
  startPage: idxOf(startP),
});
const settings = flip.getSettings();
function applyOrientation() { settings.minWidth = landscape ? pageW * 0.9 : pageW * 0.6; $("book").style.minWidth = "0"; $("book").style.minHeight = "0"; }
applyOrientation();
flip.loadFromHTML(els);

function visiblePages() {
  const i = flip.getCurrentPageIndex();
  if (flip.getOrientation() === "portrait") return [pageOf(i)].filter((p) => p <= N);
  if (i === 0 || i === T - 1) return [pageOf(i)].filter((p) => p <= N);
  const s = i % 2 ? i : i - 1;
  return [pageOf(s + 1), pageOf(s)].filter((p) => p <= N); // [يمين, يسار]
}
function current() { const v = visiblePages(); return v.length ? Math.min(...v) : N; }

function onChange() {
  const v = visiblePages(); const p = current();
  const lo = Math.min(...v), hi = Math.max(...v);
  $("pageInput").value = lo === hi ? ar(lo) : ar(lo) + "–" + ar(hi);
  // توسيط الغلاف عندما يكون الكتاب مغلقاً
  const ci = flip.getCurrentPageIndex();
  const shift = flip.getOrientation() === "portrait" ? 0 : ci === T - 1 ? pageW / 2 : ci === 0 ? -pageW / 2 : 0;
  $("sizer").style.transform = "translateX(" + shift + "px)";
  $("slider").value = p;
  store.set("pos:" + book.file, String(p));
  const i = flip.getCurrentPageIndex();
  $("nextBtn").disabled = $("nextSide").disabled = i === 0;
  $("prevBtn").disabled = $("prevSide").disabled = i >= T - 1;
  // ارسم الصفحات الظاهرة ثم المجاورة
  v.forEach(want);
  for (let k = 1; k <= 4; k++) { want(hi + k); want(lo - k); }
}

flip.on("init", () => { onChange(); $("loader").hidden = true; if (startP > 1) toast("متابعة من الصفحة " + ar(startP)); });
flip.on("flip", onChange);
flip.on("changeOrientation", onChange);

// ===== التنقل =====
const next = () => flip.flipPrev(); // للأمام في الكتاب العربي
const prev = () => flip.flipNext();
function goTo(p) { p = Math.max(1, Math.min(N, p | 0)); flip.turnToPage(idxOf(p)); onChange(); }

$("nextBtn").onclick = $("nextSide").onclick = next;
$("prevBtn").onclick = $("prevSide").onclick = prev;
$("slider").addEventListener("input", (e) => { $("pageInput").value = e.target.value; });
$("slider").addEventListener("change", (e) => goTo(+e.target.value));
$("pageInput").addEventListener("focus", (e) => e.target.select());
$("pageInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const v = parseInt(String(e.target.value).replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d)), 10);
    if (v) goTo(v); e.target.blur();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || $("zoom").classList.contains("open")) { if (e.key === "Escape") closeZoom(); return; }
  if (e.key === "ArrowLeft" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
  else if (e.key === "ArrowRight" || e.key === "PageUp") { e.preventDefault(); prev(); }
  else if (e.key === "Home") goTo(1);
  else if (e.key === "End") goTo(N);
});

// ===== تغيير حجم النافذة =====
let rt;
window.addEventListener("resize", () => {
  measure(); applyOrientation();
  clearTimeout(rt); rt = setTimeout(() => { flip.update(); onChange(); }, 120);
});

// ===== ملء الشاشة =====
$("fsBtn").onclick = () => {
  const d = document;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else { const el = d.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || (() => toast("ملء الشاشة غير مدعوم في هذا المتصفح"))).call(el); }
};

// ===== التكبير =====
let zLevel = 1, zPages = [];
async function drawZoom() {
  $("zLevel").textContent = Math.round(zLevel * 100) + "%";
  const box = $("zPages"); box.innerHTML = "";
  const fitW = Math.min(window.innerWidth - 32, 900) / (zPages.length > 1 && window.innerWidth > 700 ? 2 : 1);
  const w = Math.round(fitW * zLevel);
  for (const p of zPages) {
    const page = await pdf.getPage(p);
    const vp0 = page.getViewport({ scale: 1 });
    const scale = (w * DPR) / vp0.width;
    const vp = page.getViewport({ scale });
    const c = document.createElement("canvas");
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    c.style.width = w + "px"; c.style.height = Math.round(w / RATIO) + "px";
    box.appendChild(c);
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
  }
}
function openZoom() { zPages = visiblePages(); zLevel = 1; $("zoom").classList.add("open"); drawZoom(); }
function closeZoom() { $("zoom").classList.remove("open"); $("zPages").innerHTML = ""; }
$("zoomBtn").onclick = openZoom;
$("zClose").onclick = closeZoom;
$("zIn").onclick = () => { if (zLevel < 3) { zLevel = +(zLevel + 0.5).toFixed(1); drawZoom(); } };
$("zOut").onclick = () => { if (zLevel > 1) { zLevel = +(zLevel - 0.5).toFixed(1); drawZoom(); } };
</script>
</body>
</html>
