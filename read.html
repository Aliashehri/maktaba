<script src="assets/common.js?v=8"></script>
<script src="lib/page-flip.browser.js?v=8"></script>
<script type="module">
import * as pdfjs from "./lib/pdf.min.mjs";
pdfjs.GlobalWorkerOptions.workerSrc = "lib/pdf.worker.min.mjs";

const { loadLibrary, store, ar } = window.Lib;
const $ = (id) => document.getElementById(id);
const DPR = Math.min(window.devicePixelRatio || 1, 2.5);

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}
function fail(msg) { $("loadMsg").textContent = msg; $("loadBar").parentElement.hidden = true; }

// ===== تحديد الكتاب =====
const params = new URLSearchParams(location.search);
const data = await loadLibrary();
let book = null;
if (params.get("id")) book = data.books.find((b) => b.id === params.get("id"));
else if (params.get("file")) book = data.books.find((b) => b.file === params.get("file"));
if (!book) { fail("لم يتم العثور على الكتاب"); throw new Error("book not found"); }

const siteName = (data.site.title || "المكتبة").replace(/[\u064B-\u0652]/g, "") + (data.site.author ? " — " + data.site.author : "");
document.title = book.title + " — " + siteName;
$("title").textContent = book.title; $("zTitle").textContent = book.title;
if (data.site.allowDownload) { const d = $("download"); d.href = book.file; d.hidden = false; }

// ===== فتح ملف PDF =====
let pdf;
try {
  const task = pdfjs.getDocument({ url: book.file, rangeChunkSize: 262144, disableAutoFetch: false });
  task.onProgress = ({ loaded, total }) => { if (total) $("loadBar").style.width = Math.min(100, (loaded / total) * 100) + "%"; };
  pdf = await task.promise;
} catch (e) { console.error(e); fail("تعذّر فتح الكتاب، حاول تحديث الصفحة"); throw e; }

const N = pdf.numPages;
const T = N + (N % 2);              // عدد عناصر الكتاب (زوجي دائماً)
const idxOf = (p) => T - p;         // ترتيب معكوس ليكون التقليب من اليمين لليسار
const pageOf = (i) => T - i;
const first = await pdf.getPage(1);
const vp1 = first.getViewport({ scale: 1 });
const RATIO = vp1.width / vp1.height;

$("total").textContent = ar(N);
$("slider").max = N;

// ===== عناصر الصفحات =====
const els = [];       // حسب الفهرس
for (let i = 0; i < T; i++) {
  const p = pageOf(i);
  const d = document.createElement("div");
  d.className = "pg";
  if (i === 0 || i === T - 1) d.dataset.density = "hard";
  if (p > N) d.classList.add("blank");
  else { const ph = document.createElement("div"); ph.className = "pg-ph"; ph.textContent = ar(p); d.appendChild(ph); }
  els.push(d);
}

// ===== حساب المقاس =====
let landscape = true, pageW = 300;
function measure() {
  const st = $("stage");
  const wide = st.clientWidth > 640;
  const availW = st.clientWidth - (wide ? 130 : 16);
  const availH = st.clientHeight - (wide ? 32 : 16);
  const one = Math.min(availW, availH * RATIO);
  const two = Math.min(availW / 2, availH * RATIO);
  landscape = availW >= 600 && two >= one * 0.62;
  pageW = Math.floor(landscape ? two : one);
  $("sizer").style.width = (landscape ? pageW * 2 : pageW) + "px";
}
measure();

// ===== رسم الصفحات =====
const rendered = new Map(); // p -> width
const queue = []; let busy = false;
function want(p) {
  if (p < 1 || p > N) return;
  const target = Math.round(pageW * DPR);
  const have = rendered.get(p);
  if (have && have >= target * 0.87) return;
  if (!queue.includes(p)) queue.push(p);
  pump();
}
async function pump() {
  if (busy) return; busy = true;
  while (queue.length) {
    const p = queue.shift();
    const target = Math.round(pageW * DPR);
    try {
      const page = await pdf.getPage(p);
      const vp0 = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: target / vp0.width });
      const c = document.createElement("canvas");
      c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      c.dir = "ltr";
      const ctx = c.getContext("2d", { alpha: false }); ctx.direction = "ltr";
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      const el = els[idxOf(p)];
      el.querySelectorAll("canvas,.pg-ph").forEach((n) => n.remove());
      el.appendChild(c);
      rendered.set(p, target);
    } catch (e) { console.warn("render", p, e); }
  }
  busy = false;
}

// ===== المحرّك: كتاب مزدوج (كمبيوتر) أو صفحة واحدة (جوال) =====
const saved = parseInt(store.get("pos:" + book.file) || "1", 10);
const linkP = parseInt(params.get("p") || "0", 10);
const fromLink = linkP >= 1 && linkP <= N;
const startP = fromLink ? linkP : (saved >= 1 && saved <= N ? saved : 1);
const MODE = landscape ? "spread" : "single";
const changeCbs = [], turnCbs = [];
const emitChange = () => changeCbs.forEach((f) => f());
const emitTurn = () => turnCbs.forEach((f) => f());

function makeSpread() {
  const flip = new St.PageFlip($("book"), {
    width: Math.round(vp1.width), height: Math.round(vp1.height),
    size: "stretch", autoSize: true,
    minWidth: 50, maxWidth: 4000, minHeight: 50, maxHeight: 6000,
    showCover: true, usePortrait: true, mobileScrollSupport: false,
    drawShadow: true, maxShadowOpacity: 0.45, flippingTime: 750,
    showPageCorners: true, disableFlipByClick: false,
    startPage: idxOf(startP),
  });
  const settings = flip.getSettings();
  const fit = () => { settings.minWidth = pageW * 0.9; $("book").style.minWidth = "0"; $("book").style.minHeight = "0"; };
  fit();
  flip.loadFromHTML(els);
  let last = "";
  flip.on("changeState", (e) => { if (e.data === "flipping" && last !== "flipping") emitTurn(); last = e.data; });
  flip.on("flip", emitChange);
  flip.on("changeOrientation", emitChange);
  return {
    ready: (cb) => flip.on("init", cb),
    visible() {
      const i = flip.getCurrentPageIndex();
      if (i === 0 || i === T - 1 || flip.getOrientation() === "portrait") return [pageOf(i)].filter((p) => p <= N);
      const s = i % 2 ? i : i - 1;
      return [pageOf(s + 1), pageOf(s)].filter((p) => p <= N);
    },
    atEnd: () => flip.getCurrentPageIndex() === 0,
    atStart: () => flip.getCurrentPageIndex() >= T - 1,
    next: () => flip.flipPrev(),
    prev: () => flip.flipNext(),
    goTo(p) { flip.turnToPage(idxOf(p)); emitChange(); },
    shift() { const ci = flip.getCurrentPageIndex(); return ci === T - 1 ? pageW / 2 : ci === 0 ? -pageW / 2 : 0; },
    resize() { fit(); flip.update(); },
  };
}

function makeSingle() {
  $("book").remove();
  const box = document.createElement("div"); box.className = "sp";
  $("sizer").appendChild(box);
  const shade = document.createElement("div"); shade.className = "sp-shade";
  const size = () => { box.style.width = pageW + "px"; box.style.height = Math.round(pageW / RATIO) + "px"; };
  size();
  let cur = startP, busyAnim = false;
  const el = (p) => els[idxOf(p)];
  function mountOnly(p) {
    box.replaceChildren(el(p));
    Object.assign(el(p).style, { transform: "", transition: "", zIndex: 2, filter: "" });
  }
  // dir = 1 للأمام (الصفحة الحالية تنقلب من حافتها اليسرى نحو اليمين)، -1 للخلف
  function setup(dir) {
    const top = dir > 0 ? el(cur) : el(cur - 1), under = dir > 0 ? el(cur + 1) : el(cur);
    [top, under].forEach((x) => Object.assign(x.style, { transition: "", filter: "" }));
    under.style.zIndex = 1; under.style.transform = "";
    top.style.zIndex = 3;
    box.replaceChildren(under, shade, top);
    return { top, dir };
  }
  function draw(st, prog) {
    const ang = st.dir > 0 ? prog * 180 : (1 - prog) * 180;
    st.top.style.transform = "rotateY(" + ang + "deg)";
    st.top.style.filter = "brightness(" + (1 - Math.min(ang, 90) / 90 * 0.22) + ")";
    shade.style.opacity = String(Math.sin(Math.min(ang, 180) * Math.PI / 180) * 0.45);
  }
  function finish(st, commit, ms = 420) {
    busyAnim = true;
    const target = commit ? (st.dir > 0 ? 180 : 0) : (st.dir > 0 ? 0 : 180);
    st.top.style.transition = "transform " + ms + "ms cubic-bezier(.25,.75,.3,1), filter " + ms + "ms";
    shade.style.transition = "opacity " + ms + "ms";
    requestAnimationFrame(() => {
      st.top.style.transform = "rotateY(" + target + "deg)";
      st.top.style.filter = "brightness(1)";
      shade.style.opacity = "0";
    });
    if (commit) emitTurn();
    setTimeout(() => {
      shade.style.transition = "";
      if (commit) cur += st.dir;
      mountOnly(cur); busyAnim = false;
      if (commit) emitChange();
    }, ms + 30);
  }
  function turn(dir) {
    if (busyAnim || cur + dir < 1 || cur + dir > N) return;
    const st = setup(dir);
    draw(st, 0.02);
    box.offsetWidth; // إجبار الرسم قبل الحركة
    finish(st, true, 520);
  }
  // اللمس والسحب
  let d = null;
  box.addEventListener("pointerdown", (e) => {
    if (busyAnim || e.button > 0) return;
    d = { x: e.clientX, y: e.clientY, t: performance.now(), st: null, prog: 0 };
    box.setPointerCapture(e.pointerId);
  });
  box.addEventListener("pointermove", (e) => {
    if (!d) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (!d.st) {
      if (Math.abs(dx) < 10) return;
      if (Math.abs(dy) > Math.abs(dx)) { d = null; return; }
      const dir = dx > 0 ? 1 : -1;
      if (cur + dir < 1 || cur + dir > N) { d.blocked = true; return; }
      d.st = setup(dir);
    }
    d.prog = Math.max(0, Math.min(1, Math.abs(dx) / (box.clientWidth * 0.95)));
    if ((dx > 0 ? 1 : -1) !== d.st.dir) d.prog = 0;
    draw(d.st, d.prog);
  });
  const up = (e) => {
    if (!d) return;
    const dx = e.clientX - d.x, dt = performance.now() - d.t;
    if (d.st) finish(d.st, d.prog > 0.28 || (Math.abs(dx) / dt > 0.45 && d.prog > 0.05));
    else if (!d.blocked && Math.abs(dx) < 10 && Math.abs(e.clientY - d.y) < 10) {
      const r = box.getBoundingClientRect(), x = e.clientX - r.left;
      if (x < r.width * 0.42) turn(1); else if (x > r.width * 0.58) turn(-1);
    }
    d = null;
  };
  box.addEventListener("pointerup", up);
  box.addEventListener("pointercancel", (e) => { if (d && d.st) finish(d.st, false); d = null; });
  mountOnly(cur);
  return {
    ready: (cb) => setTimeout(cb, 0),
    visible: () => [cur],
    atEnd: () => cur >= N,
    atStart: () => cur <= 1,
    next: () => turn(1),
    prev: () => turn(-1),
    goTo(p) { if (busyAnim) return; cur = p; mountOnly(cur); emitChange(); },
    shift: () => 0,
    resize() { size(); },
  };
}

const book2 = MODE === "spread" ? makeSpread() : makeSingle();
document.body.classList.add("mode-" + MODE);

function visiblePages() { return book2.visible(); }
function current() { const v = visiblePages(); return v.length ? Math.min(...v) : N; }

function onChange() {
  const v = visiblePages(); const p = current();
  const lo = Math.min(...v), hi = Math.max(...v);
  $("pageInput").value = lo === hi ? ar(lo) : ar(lo) + "–" + ar(hi);
  $("sizer").style.transform = "translateX(" + book2.shift() + "px)"; // توسيط الغلاف
  $("slider").value = p;
  store.set("pos:" + book.file, String(p));
  store.set("last:" + book.file, String(Date.now()));
  paintBm();
  $("nextBtn").disabled = $("nextSide").disabled = book2.atEnd();
  $("prevBtn").disabled = $("prevSide").disabled = book2.atStart();
  v.forEach(want);
  for (let k = 1; k <= 4; k++) { want(hi + k); want(lo - k); }
}
changeCbs.push(onChange);
book2.ready(() => { onChange(); $("loader").hidden = true; if (fromLink) toast("الصفحة " + ar(startP)); else if (startP > 1) toast("متابعة من الصفحة " + ar(startP)); });

// ===== صوت تقليب الورق =====
let soundOn = store.get("sound") !== "off", actx = null, flipBuf = null, loading = null;
const SND = "assets/flip.mp3?v=8";
const flipData = fetch(SND).then((r) => r.arrayBuffer()).catch(() => null);
function paintSound() {
  const on = $("sndOn"), off = $("sndOff");
  if (soundOn) { on.removeAttribute("hidden"); off.setAttribute("hidden", ""); }
  else { off.removeAttribute("hidden"); on.setAttribute("hidden", ""); }
  $("soundBtn").setAttribute("aria-pressed", String(soundOn));
  $("soundBtn").title = soundOn ? "كتم صوت التقليب" : "تشغيل صوت التقليب";
  $("soundBtn").classList.toggle("muted", !soundOn);
}
function audio() {
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
  if (!actx) actx = new AC();
  if (actx.state !== "running") actx.resume().catch(() => {});
  if (!flipBuf && !loading) {
    loading = flipData.then((ab) => ab ? ab.slice(0) : fetch(SND).then((r) => r.arrayBuffer()))
      .then((ab) => new Promise((ok, no) => actx.decodeAudioData(ab, ok, no)))
      .then((buf) => { flipBuf = buf; }).catch((e) => { console.warn("sound", e); loading = null; });
  }
  return actx;
}
// المتصفحات (خاصة الجوال) لا تسمح بالصوت إلا بعد لمسة كاملة؛ نفتحه عند أول لمسة/نقرة
function unlock() {
  if (!soundOn) return;
  const a = audio(); if (!a || a.state === "running" && unlock.done) return;
  try { const b = a.createBuffer(1, 1, 22050), s = a.createBufferSource(); s.buffer = b; s.connect(a.destination); s.start(0); unlock.done = true; } catch (e) {}
}
["pointerup", "touchend", "click", "keydown"].forEach((ev) => window.addEventListener(ev, unlock, { passive: true, capture: true }));
let fallbackEl = null;
async function playFlip() {
  if (!soundOn) return;
  const a = audio();
  if (a && a.state !== "running") { try { await a.resume(); } catch (e) {} }
  if (a && a.state === "running") {
    if (!flipBuf && loading) await loading;
    if (flipBuf) {
      const src = a.createBufferSource(); src.buffer = flipBuf;
      src.playbackRate.value = 0.92 + Math.random() * 0.16;
      const g = a.createGain(); g.gain.value = 1;
      src.connect(g); g.connect(a.destination); src.start();
      return;
    }
  }
  try { fallbackEl = fallbackEl || new Audio(SND); fallbackEl.currentTime = 0; await fallbackEl.play(); } catch (e) {}
}
paintSound();
$("soundBtn").onclick = () => { soundOn = !soundOn; store.set("sound", soundOn ? "on" : "off"); paintSound(); if (soundOn) { unlock(); playFlip(); } toast(soundOn ? "تم تشغيل الصوت" : "تم كتم الصوت"); };
turnCbs.push(playFlip);

// ===== التنقل =====
const next = () => book2.next(); // للأمام في الكتاب العربي
const prev = () => book2.prev();
function goTo(p) { p = Math.max(1, Math.min(N, p | 0)); book2.goTo(p); }

$("nextBtn").onclick = $("nextSide").onclick = next;
$("prevBtn").onclick = $("prevSide").onclick = prev;
$("slider").addEventListener("input", (e) => { $("pageInput").value = ar(e.target.value); });
$("slider").addEventListener("change", (e) => goTo(+e.target.value));
$("pageInput").addEventListener("focus", (e) => e.target.select());
$("pageInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const v = parseInt(String(e.target.value).replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d)), 10);
    if (v) goTo(v); e.target.blur();
  }
});
$("pageInput").addEventListener("change", (e) => {
  const v = parseInt(String(e.target.value).replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d)), 10);
  if (v) goTo(v);
});
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || $("zoom").classList.contains("open")) { if (e.key === "Escape") closeZoom(); return; }
  if (e.key === "ArrowLeft" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
  else if (e.key === "ArrowRight" || e.key === "PageUp") { e.preventDefault(); prev(); }
  else if (e.key === "Home") goTo(1);
  else if (e.key === "End") goTo(N);
});

// ===== تغيير حجم النافذة / تدوير الجوال =====
let rt;
window.addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    const was = landscape; measure();
    if (was !== landscape) { store.set("pos:" + book.file, String(current())); location.reload(); return; }
    book2.resize(); onChange();
  }, 150);
});

// ===== ملء الشاشة =====
$("fsBtn").onclick = () => {
  const d = document;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else { const el = d.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || (() => toast("ملء الشاشة غير مدعوم في هذا المتصفح"))).call(el); }
};

// ===== العلامات المرجعية (تُحفظ في جهاز القارئ) =====
const BMK = "bm:" + book.file;
function getBm() { try { return JSON.parse(store.get(BMK) || "[]").filter((x) => x.p >= 1 && x.p <= N); } catch (e) { return []; } }
function setBm(a) { a.sort((x, y) => x.p - y.p); store.set(BMK, JSON.stringify(a)); paintBm(); }
function paintBm() {
  const a = getBm(), p = current(), on = a.some((x) => x.p === p);
  $("bmBtn").classList.toggle("on", on); $("bmBtn").setAttribute("aria-pressed", String(on));
  $("bmBtn").title = on ? "إزالة العلامة من هذه الصفحة" : "إضافة علامة على هذه الصفحة";
  $("bmCount").hidden = !a.length; $("bmCount").textContent = ar(a.length);
}
$("bmBtn").onclick = () => {
  const a = getBm(), p = current(), i = a.findIndex((x) => x.p === p);
  if (i >= 0) { a.splice(i, 1); setBm(a); toast("أُزيلت العلامة من الصفحة " + ar(p)); }
  else { a.push({ p, t: Date.now() }); setBm(a); toast("🔖 حُفظت علامة على الصفحة " + ar(p)); }
};
function openSheet(id) { document.querySelectorAll(".sheet").forEach((x) => x.hidden = x.id !== id ? true : x.hidden); $(id).hidden = false; }
function closeSheets() { document.querySelectorAll(".sheet").forEach((x) => x.hidden = true); }
document.querySelectorAll("[data-close]").forEach((b) => b.onclick = closeSheets);
$("bmListBtn").onclick = () => {
  if (!$("bmSheet").hidden) return closeSheets();
  const ul = $("bmList"); ul.innerHTML = ""; const a = getBm();
  if (!a.length) { const li = document.createElement("li"); li.className = "bm-empty"; li.textContent = "لا توجد علامات بعد. اضغط زر 🔖 لحفظ الصفحة الحالية."; ul.appendChild(li); }
  a.forEach((x) => {
    const li = document.createElement("li");
    const go = document.createElement("button"); go.className = "bm-go";
    const d = new Date(x.t);
    go.innerHTML = "<b></b><small></small>";
    go.querySelector("b").textContent = "صفحة " + ar(x.p);
    go.querySelector("small").textContent = isNaN(d) ? "" : d.toLocaleDateString("ar-SA-u-ca-islamic-umalqura-nu-arab", { day: "numeric", month: "long" });
    go.onclick = () => { closeSheets(); goTo(x.p); };
    const del = document.createElement("button"); del.className = "bm-del"; del.setAttribute("aria-label", "حذف العلامة"); del.textContent = "✕";
    del.onclick = () => { setBm(getBm().filter((y) => y.p !== x.p)); li.remove(); if (!getBm().length) $("bmListBtn").onclick(), $("bmListBtn").onclick(); };
    li.append(go, del); ul.appendChild(li);
  });
  openSheet("bmSheet");
};

// ===== مشاركة صفحة محددة =====
function pageLink(p) {
  const u = new URL(location.href); u.search = "";
  u.searchParams.set(book.id ? "id" : "file", book.id || book.file); u.searchParams.set("p", String(p));
  return u.toString();
}
$("shareBtn").onclick = async () => {
  const p = current(), url = pageLink(p);
  const text = "📖 " + book.title + " — صفحة " + ar(p) + "\n" + siteName;
  if (navigator.share && matchMedia("(pointer:coarse)").matches) {
    try { await navigator.share({ title: book.title, text, url }); return; } catch (e) { if (e && e.name === "AbortError") return; }
  }
  $("shareWhat").textContent = book.title + " — صفحة " + ar(p);
  $("shareWa").href = "https://wa.me/?text=" + encodeURIComponent(text + "\n" + url);
  $("shareCopy").onclick = async () => {
    try { await navigator.clipboard.writeText(url); toast("تم نسخ الرابط ✓"); }
    catch (e) { const t = document.createElement("textarea"); t.value = url; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); toast("تم نسخ الرابط ✓"); } catch (_) { prompt("انسخ الرابط:", url); } t.remove(); }
    closeSheets();
  };
  $("shareWa").onclick = () => setTimeout(closeSheets, 300);
  openSheet("shareSheet");
};
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheets(); });

// ===== التكبير =====
let zLevel = 1, zPages = [];
let zToken = 0;
async function drawZoom() {
  const token = ++zToken;
  $("zLevel").textContent = Math.round(zLevel * 100) + "%";
  const box = $("zPages"); box.innerHTML = "";
  const fitW = Math.min(window.innerWidth - 32, 900) / (zPages.length > 1 && window.innerWidth > 700 ? 2 : 1);
  const w = Math.round(fitW * zLevel);
  for (const p of zPages) {
    const page = await pdf.getPage(p);
    const vp0 = page.getViewport({ scale: 1 });
    const scale = (w * DPR) / vp0.width;
    const vp = page.getViewport({ scale });
    const c = document.createElement("canvas");
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    c.style.width = w + "px"; c.style.height = Math.round(w / RATIO) + "px";
    c.dir = "ltr";
    const zctx = c.getContext("2d", { alpha: false }); zctx.direction = "ltr";
    zctx.fillStyle = "#fff"; zctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: zctx, viewport: vp }).promise;
    if (token !== zToken) return;
    box.appendChild(c);
  }
}
function openZoom() { zPages = visiblePages(); zLevel = 1; $("zoom").classList.add("open"); drawZoom(); }
function closeZoom() { $("zoom").classList.remove("open"); $("zPages").innerHTML = ""; }
$("zoomBtn").onclick = openZoom;
$("zClose").onclick = closeZoom;
$("zIn").onclick = () => { if (zLevel < 3) { zLevel = +(zLevel + 0.5).toFixed(1); drawZoom(); } };
$("zOut").onclick = () => { if (zLevel > 1) { zLevel = +(zLevel - 0.5).toFixed(1); drawZoom(); } };
</script>
</body>
